<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:30px;background:#0d121a;color:#dce3ec}#host{max-width:720px;margin:auto}.preview-label{max-width:720px;margin:0 auto 14px;font-size:11px;letter-spacing:1.2px;color:#8495ab;line-height:1.5}@media(max-width:500px){body{padding:12px}}</style>
<script src="/node_modules/maplibre-gl/dist/maplibre-gl.js"></script></head><body>
<div class="preview-label">OSM PARKING · UI TEST PREVIEW<br>SAMPLE PARKING RECORDS / OFFLINE MAP FIXTURE</div><div id="host"></div>
<script>
class PreviewIcon extends HTMLElement{static get observedAttributes(){return ['icon'];}connectedCallback(){this.render();}attributeChangedCallback(){this.render();}render(){const icons={'magnify':'⌕','refresh':'↻','filter-variant':'☷','fit-to-screen':'⌖','theme-light-dark':'◐','arrow-expand':'⤢','sort-variant':'≡','cash':'€','parking':'P','road-variant':'≋','office-building':'▥','car-lifted-pickup':'↧','train-car':'▣','directions':'↗'};this.innerHTML='<span style="display:inline-flex;align-items:center;justify-content:center;width:var(--mdc-icon-size,20px);height:var(--mdc-icon-size,20px);font-size:var(--mdc-icon-size,20px);line-height:1" aria-hidden="true">'+(icons[(this.getAttribute('icon')||'').replace('mdi:','')]||'·')+'</span>';}}
customElements.define('ha-icon',PreviewIcon);customElements.define('ha-card',class extends HTMLElement{});
window.serviceCalls=[];

{provider:'osm',provider_name:'OpenStreetMap',osm_type:'way',osm_id:42,name:'Deutz Park & Ride',distance_m:420,latitude:50.9362,longitude:6.9911,category:'park_and_ride',fee:'no',availability_kind:'static',capacity:310,data_sources:['osm']},
{provider:'parkapi',provider_name:'ParkAPI',provider_id:'B',name:'City Centre Parking',distance_m:690,latitude:50.9431,longitude:6.9892,category:'multi_storey',fee:'yes',price:'3.00 € / 1 h',availability_kind:'reported',free_capacity:64,capacity:280,availability_checked_at:new Date().toISOString()},
{provider:'osm',provider_name:'OpenStreetMap',osm_type:'node',osm_id:19,name:'Riverside Street Parking',distance_m:260,latitude:50.9374,longitude:6.9778,category:'street',fee:'unknown',availability_kind:'static'},
{provider:'city',provider_name:'Municipal parking',provider_id:'C',name:'Station Garage — north entrance with a deliberately long name',distance_m:1040,latitude:50.9334,longitude:6.9806,category:'multi_storey',fee:'yes',availability_kind:'live',has_realtime_data:true,free_capacity:0,capacity:155,realtime_updated_at:new Date().toISOString()}
].map(item=>({...item,navigation_url:'https://www.google.com/maps/dir/?api=1&destination='+item.latitude+','+item.longitude,provider_url:'https://example.com/parking',address:'Sample street address'}));
window.zone={type:'Feature',geometry:{type:'Polygon',coordinates:[[[6.975,50.936],[6.980,50.936],[6.980,50.941],[6.975,50.941],[6.975,50.936]]]},properties:{record_type:'zone',name:'Example controlled zone',provider_url:'https://example.com/zone'}};
window.attributes={status:'ok',destination_entity:'sensor.destination',destination_name:'LANXESS arena · Köln',destination_latitude:50.9384967,destination_longitude:6.9828844,suggestions:window.sampleItems,parking_zones:[window.zone]};
window.ha={language:'en',user:{id:'preview-user'},themes:{darkMode:true},states:{'sensor.parking_suggestions':{state:'ok',attributes:window.attributes}},callService:async(...args)=>{window.serviceCalls.push(args);}};
window.applyTheme=(dark)=>{window.ha={...window.ha,themes:{darkMode:dark}};const host=document.getElementById('host');host.style.setProperty('--ha-card-background',dark?'#151b24':'#ffffff');host.style.setProperty('--card-background-color',dark?'#151b24':'#ffffff');host.style.setProperty('--primary-text-color',dark?'#e9edf4':'#1d2939');host.style.setProperty('--secondary-text-color',dark?'#a2b0c2':'#617185');host.style.setProperty('--primary-color',dark?'#78c6df':'#18738f');host.style.setProperty('--divider-color',dark?'#2a3544':'#dce2e9');host.style.setProperty('--secondary-background-color',dark?'#1b2430':'#f3f6f8');document.body.style.background=dark?'#0d121a':'#edf1f5';if(window.card)window.card.hass=window.ha;};
window.createCard=()=>{const root=document.getElementById('host').shadowRoot || document.getElementById('host').attachShadow({mode:'open'});const card=document.createElement('osm-parking-map-card');card.setConfig({entity:'sensor.parking_suggestions',map_height:220,theme_mode:'auto'});root.append(card);window.card=card;window.applyTheme(window.ha.themes.darkMode);card.hass=window.ha;return card;};
</script>
<script src="/custom_components/osm_parking/frontend/osm-parking-map-card.js"></script><script>window.createCard();</script></body></html>
