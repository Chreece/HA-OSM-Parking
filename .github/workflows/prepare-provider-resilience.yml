name: Prepare automatic provider resilience
on:
  push:
    branches: [fix/automatic-provider-failover]
    paths: [.github/workflows/prepare-provider-resilience.yml]
permissions:
  contents: write
concurrency:
  group: automatic-provider-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source updates
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/automatic-provider-failover
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 1e8ba3644fc663e789482d34a6356788543efdb9
          python tools/prepare_auto_providers.py
      - name: Validate all provider, wizard and fault-injection contracts
        run: |
          set -euo pipefail
          mkdir -p provider-evidence
          python -m compileall -q custom_components/osm_parking
          python -m unittest discover -s tests -v 2>&1 | tee provider-evidence/tests.log
          python tools/card/build.py --check
          node --check custom_components/osm_parking/frontend/osm-parking-map-card.js
          node --test tests/card/filter.test.cjs | tee provider-evidence/card-tests.log
      - name: Read-only probes of official public sources
        run: python tools/probe_parking_sources.py
      - name: Validate the actual probed inventories when available
        run: |
          python - <<'PY'
          import importlib.util, json, sys, types
          from pathlib import Path
          root=Path('custom_components/osm_parking').resolve()
          for name,directory in [('custom_components',root.parent),('custom_components.osm_parking',root)]:
              mod=types.ModuleType(name);mod.__path__=[str(directory)];sys.modules[name]=mod
          aiohttp=types.ModuleType('aiohttp');aiohttp.ClientError=Exception;aiohttp.ClientSession=object;sys.modules['aiohttp']=aiohttp
          from custom_components.osm_parking.providers.athens_zones import _catalog as athens
          from custom_components.osm_parking.providers.toulouse import ToulouseParkingProvider
          summary={}
          for name,parser in [('athens_ows',athens),('athens_wfs',athens),('toulouse_v2',ToulouseParkingProvider._catalog),('toulouse_v1',ToulouseParkingProvider._catalog)]:
              path=Path('provider-evidence')/(name+'.json')
              if not path.exists():
                  summary[name]={'usable':False,'reason':'No JSON response captured'}
                  continue
              try:
                  rows=parser(json.loads(path.read_text()))
                  summary[name]={'usable':True,'records':len(rows)}
              except Exception as exc:
                  summary[name]={'usable':False,'reason':type(exc).__name__}
          Path('provider-evidence/validated-inventories.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Verify frontend behavior is unchanged except version
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          path='custom_components/osm_parking/frontend/osm-parking-map-card.js'
          old=subprocess.check_output(['git','show','1e8ba3644fc663e789482d34a6356788543efdb9:'+path]).decode()
          current=Path(path).read_text()
          assert old.replace('v1.3.1</span>','v1.4.0</span>')==current, 'Unexpected frontend change'
          print('FRONTEND_PRESERVATION=PASS')
          PY
      - name: Preserve tested sources and public probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-provider-evidence
          path: |
            provider-evidence/
            custom_components/osm_parking/
            tests/provider_safety_cases.py
            docs/provider-resilience-research.md
          retention-days: 14
      - name: Commit validated preparation on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/automatic-provider-failover
          test "$(git ls-remote origin refs/heads/fix/automatic-provider-failover | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- tools/auto-transfer/part-1.b64 tools/prepare_auto_providers.py .github/workflows/prepare-provider-resilience.yml
          find custom_components tests tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -u
          git diff --cached --check
          git commit -m 'Complete automatic GIS and isolated provider failover v1.4.0 [skip ci]'
          git push origin HEAD:refs/heads/fix/automatic-provider-failover
