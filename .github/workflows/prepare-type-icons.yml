name: Prepare parking type icons
on:
  push:
    branches: [feat/parking-type-marker-icons]
    paths: [.github/workflows/prepare-type-icons.yml]
permissions:
  contents: write
concurrency:
  group: prepare-parking-type-icons
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble reviewed icon-only change
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/parking-type-marker-icons
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = fc1db8abc9a2f6c98951161336ddcdf5f2fb8f0e
          # Workflow changes have already been committed via the authorized
          # connector. Reproduce and verify them, but never push a workflow
          # edit using this job's contents-only token.
          git show fc1db8abc9a2f6c98951161336ddcdf5f2fb8f0e:.github/workflows/card-visual.yml > .github/workflows/card-visual.yml
          python tools/prepare_type_icons.py
          test -z "$(git diff --name-only -- .github/workflows)"
          python - <<'PY'
          from pathlib import Path
          for name in ('README.md', 'tools/card/guide.md'):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python tools/card/build.py --check
          node --check custom_components/osm_parking/frontend/osm-parking-map-card.js
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='fc1db8abc9a2f6c98951161336ddcdf5f2fb8f0e'
          for path in subprocess.check_output(['git','ls-tree','-r','--name-only',base,'--','custom_components/osm_parking']).decode().splitlines():
              if '/frontend/' in path: continue
              previous=subprocess.check_output(['git','show',base+':'+path])
              current=Path(path).read_bytes()
              if path.endswith('/manifest.json'):
                  old=json.loads(previous);new=json.loads(current);new['version']=old['version'];assert old==new,path
              elif path=='custom_components/osm_parking/__init__.py':
                  assert previous.replace(b'CARD_VERSION = "1.4.0"',b'CARD_VERSION = "1.4.1"')==current,path
              else: assert previous==current,path
          print('BACKEND_PRESERVATION=PASS')
          PY
      - name: Run backend and JavaScript regression tests
        run: |
          set -euo pipefail
          mkdir -p card-evidence
          python -m compileall -q custom_components/osm_parking
          python -m unittest discover -s tests -v 2>&1 | tee card-evidence/python-tests.log
          node --test tests/card/filter.test.cjs tests/card/type_icons.test.cjs | tee card-evidence/javascript-tests.log
      - name: Install pinned browser dependencies
        run: |
          npm install --no-save --package-lock=false maplibre-gl@5.6.2
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check exact type glyphs and internal facility matching
        run: python tests/card/type_icons_check.py
      - name: Retest filters, themes, map controls and folded result reveal
        run: |
          python tests/card/browser_check.py
          python tests/card/map_controls_check.py
          python tests/card/results_disclosure_check.py
      - name: Capture README gallery from the new bundled card
        run: python tools/card/readme_screenshots.py
      - name: Commit validated app sources on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/parking-type-marker-icons
          test "$(git ls-remote origin refs/heads/feat/parking-type-marker-icons | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- tools/prepare_type_icons.py
          find tools tests custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -- tools/card custom_components/osm_parking/frontend custom_components/osm_parking/__init__.py custom_components/osm_parking/manifest.json tests/card/browser_check.py README.md CHANGELOG.md assets/screenshots
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git commit -m 'Show parking type icons and keep facility matching internal (v1.4.1)'
          git push origin HEAD:refs/heads/feat/parking-type-marker-icons
          git rev-parse HEAD > card-evidence/tested-source-commit.txt
      - name: Preserve exact source and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parking-type-icons-evidence
          path: |
            card-evidence/
            assets/screenshots/
            tools/card/
            tests/card/
            custom_components/osm_parking/frontend/
            README.md
            CHANGELOG.md
          retention-days: 14
