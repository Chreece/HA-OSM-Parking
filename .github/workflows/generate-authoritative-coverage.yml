name: Generate authoritative Netherlands coverage
on:
  push:
    branches: [feat/authoritative-coverage-provider-research]
    paths: [.github/workflows/generate-authoritative-coverage.yml]
permissions:
  contents: write
concurrency:
  group: generate-authoritative-coverage
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from official Kadaster/PDOK BRK geometry
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/authoritative-coverage-provider-research
          python -m pip install --disable-pip-version-check shapely==2.1.2 pyproj==3.7.2
          python tools/generate_authoritative_coverage.py | tee /tmp/coverage-generation.json
          test -s custom_components/osm_parking/data/coverage/netherlands_brk.geojson
          test -s custom_components/osm_parking/data/coverage/netherlands_rdw_10km.geojson
      - name: Validate bundled geometry with runtime-only parser
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("custom_components/osm_parking/coverage_geometry.py")
          spec=importlib.util.spec_from_file_location("coverage_geometry_under_test",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          exact=module.load_coverage("netherlands_brk.geojson")
          buffered=module.load_coverage("netherlands_rdw_10km.geojson")
          dutch={
              "Amsterdam":(52.3676,4.9041),
              "Rotterdam":(51.9244,4.4777),
              "Maastricht":(50.8514,5.6910),
              "Groningen":(53.2194,6.5665),
              "Enschede":(52.2215,6.8937),
          }
          german={
              "Cologne":(50.9375,6.9603),
              "Dusseldorf":(51.2277,6.7735),
              "Dortmund":(51.5136,7.4653),
              "Frankfurt":(50.1109,8.6821),
          }
          for name,(lat,lon) in dutch.items():
              assert exact.contains(lat,lon), name
              assert buffered.contains(lat,lon), name
          for name,(lat,lon) in german.items():
              assert not exact.contains(lat,lon), name
              assert not buffered.contains(lat,lon), name
          # Aachen is outside the Netherlands itself but close enough that a
          # maximum-radius search can legitimately cross into NL.
          assert not exact.contains(50.7753,6.0839)
          assert buffered.contains(50.7753,6.0839)
          props=buffered.properties
          assert props["source_authority"]=="Kadaster / PDOK"
          assert props["source_license"]=="CC BY 4.0"
          assert props["buffer_m"]==10000
          print("AUTHORITATIVE_COVERAGE_RUNTIME_VALIDATION=PASS")
          PY
      - name: Commit generated coverage only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/authoritative-coverage-provider-research | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/osm_parking/data/coverage/netherlands_brk.geojson custom_components/osm_parking/data/coverage/netherlands_rdw_10km.geojson
          git diff --cached --check
          git commit -m 'Bundle authoritative Netherlands BRK coverage [skip ci]'
          git push origin HEAD:refs/heads/feat/authoritative-coverage-provider-research
