name: Prepare README screenshots

on:
  push:
    branches: [release/readme-card-1.3.1]
    paths: [.github/workflows/readme-release-prepare.yml]

permissions:
  contents: write

concurrency:
  group: readme-card-1.3.1
  cancel-in-progress: false

jobs:
  prepare:
    name: Capture current card and prepare release
    if: github.ref == 'refs/heads/release/readme-card-1.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 4678a7b5831adc9e88321229765b1f633ec8b18d
      VERSION: 1.3.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare README, release notes and consistent version
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          assert version == '1.3.1'
          build = Path('tools/card/build.py')
          text = build.read_text(encoding='utf-8')
          assert text.count("VERSION = '1.3.0'") == 1
          build.write_text(text.replace("VERSION = '1.3.0'", "VERSION = '1.3.1'"), encoding='utf-8')
          source = Path('tools/card/explorer.js')
          text = source.read_text(encoding='utf-8')
          assert text.count('<span class="version">v1.3.0</span>') == 1
          source.write_text(text.replace('<span class="version">v1.3.0</span>', '<span class="version">v1.3.1</span>'), encoding='utf-8')
          notes = '''## v1.3.1

          ### README screenshot refresh

          - Replaced the old SVG dashboard examples with new PNG browser screenshots of the shipped compact parking card.
          - Added desktop dark/light views and Greek mobile views, including the expanded parking-type, cost, data-quality, source and distance filters.
          - Captures use the actual bundled card and pinned MapLibre with illustrative parking records and a labelled local map fixture. They are not screenshots of a live Home Assistant installation or evidence of current vacancies.
          - Added a reproducible screenshot command and source/image fingerprints for future documentation updates.
          - Updated the README card example to the current compact map options.

          ### Compatibility and validation

          - Retains the v1.3.0 card behavior, all provider backends, credentials, the four-step setup, source-quality ranking and deduplication. Runtime changes are limited to the release version labels.
          - Revalidated Python contracts, JavaScript filter/sort tests and real-browser interactions, themes, mobile layouts and visible map controls before preparing the gallery.
          - Existing configuration remains compatible; restart Home Assistant and reload the dashboard after updating.
          '''
          # Remove the YAML indentation common to continuation lines.
          notes = '\n'.join(line[10:] if line.startswith('          ') else line for line in notes.splitlines()) + '\n'
          Path('tools/card/release.md').write_text(notes, encoding='utf-8')
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          assert text.count('## Screenshots\n') == 1
          start = text.index('## Screenshots\n')
          end = text.index('## Languages\n', start)
          gallery = '''## Screenshots

          The redesigned card keeps the map compact and puts parking results, search, filters and sorting within easy reach.

          ### Desktop — dark mode

          <p align="center">
            <img src="https://raw.githubusercontent.com/Chreece/HA-OSM-Parking/main/assets/screenshots/card-desktop-dark.png" alt="New OSM Parking card in dark mode with compact map, search, sorting and parking result cards — sample data" width="720">
          </p>

          ### Desktop — light mode

          <p align="center">
            <img src="https://raw.githubusercontent.com/Chreece/HA-OSM-Parking/main/assets/screenshots/card-desktop-light.png" alt="New OSM Parking card in light mode with the same compact map and result layout — sample data" width="720">
          </p>

          ### Mobile — Greek interface and expanded filters

          <p align="center">
            <img src="https://raw.githubusercontent.com/Chreece/HA-OSM-Parking/main/assets/screenshots/card-mobile-greek-dark.png" alt="Greek mobile parking card with compact dark map, distance sorting, availability labels and navigation — sample data" width="360">
            <img src="https://raw.githubusercontent.com/Chreece/HA-OSM-Parking/main/assets/screenshots/card-mobile-greek-filters.png" alt="Greek mobile card with parking-type, cost, data-quality, source and distance filters expanded — sample data" width="360">
          </p>

          > Browser renders of the actual shipped card using the standalone preview, sample parking records, preview icons and a local schematic map fixture. These are **not** live Home Assistant or municipal parking readings. In your installation the card uses its configured map style and real integration results.

          Screenshots can be regenerated with `python3 tools/card/readme_screenshots.py` after installing the browser dependencies used by `.github/workflows/card-visual.yml`. Capture details and SHA-256 fingerprints are recorded in [`assets/screenshots/card-screenshots.json`](assets/screenshots/card-screenshots.json).

          '''
          gallery = '\n'.join(line[10:] if line.startswith('          ') else line for line in gallery.splitlines()) + '\n'
          text = text[:start] + gallery + text[end:]
          text = text.replace('height: 450\nshow_list: true', 'map_height: 220\ntheme_mode: auto\nshow_list: true')
          readme.write_text(text, encoding='utf-8')
          PY
          python3 tools/card/build.py
          python3 tools/card/build.py --check
      - name: Prove runtime behavior is preserved
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path('custom_components/osm_parking')
          for path in root.rglob('*'):
              if not path.is_file() or '__pycache__' in path.parts or path.suffix == '.pyc':
                  continue
              old = subprocess.check_output(['git', 'show', os.environ['BASE'] + ':' + path.as_posix()])
              if path == root / 'manifest.json':
                  data = json.loads(old)
                  data['version'] = os.environ['VERSION']
                  assert json.loads(path.read_bytes()) == data, str(path)
              elif path == root / '__init__.py':
                  expected = old.replace(b'CARD_VERSION = "1.3.0"', b'CARD_VERSION = "1.3.1"')
                  assert path.read_bytes() == expected, str(path)
              elif path == root / 'frontend/osm-parking-map-card.js':
                  expected = old.replace(b'<span class="version">v1.3.0</span>', b'<span class="version">v1.3.1</span>')
                  assert path.read_bytes() == expected, str(path)
              else:
                  assert path.read_bytes() == old, str(path)
          print('RUNTIME_PRESERVED_EXCEPT_VERSION=PASS')
          PY
      - name: Python and JavaScript regression tests
        run: |
          python3 -m compileall -q custom_components/osm_parking tools/card
          python3 -m unittest discover -s tests -v
          node --check custom_components/osm_parking/frontend/osm-parking-map-card.js
          node --test tests/card/filter.test.cjs
      - name: Install isolated browser dependencies
        run: |
          npm install --no-save --package-lock=false maplibre-gl@5.6.2
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Validate full card interactions and map controls
        run: |
          python3 tests/card/browser_check.py
          python3 tests/card/map_controls_check.py
      - name: Capture current README gallery
        run: python3 tools/card/readme_screenshots.py
      - name: Preserve images and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-card-1.3.1-evidence
          path: |
            assets/screenshots/card-*.png
            assets/screenshots/card-screenshots.json
            card-evidence/
          retention-days: 30
      - name: Commit reviewed source and generated images to release branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/readme-card-1.3.1'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/release/readme-card-1.3.1 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # This one-time preparation workflow must not remain in main.
          git rm .github/workflows/readme-release-prepare.yml
          git add -- README.md CHANGELOG.md tools/card/build.py tools/card/release.md tools/card/explorer.js \
            custom_components/osm_parking/manifest.json custom_components/osm_parking/__init__.py \
            custom_components/osm_parking/frontend/osm-parking-map-card.js \
            assets/screenshots/card-desktop-dark.png assets/screenshots/card-desktop-light.png \
            assets/screenshots/card-mobile-greek-dark.png assets/screenshots/card-mobile-greek-filters.png \
            assets/screenshots/card-screenshots.json
          git commit -m 'Refresh README with new card screenshots and prepare v1.3.1'
          git push origin HEAD:refs/heads/release/readme-card-1.3.1
          echo 'README_GALLERY_READY_FOR_REVIEW=PASS'
