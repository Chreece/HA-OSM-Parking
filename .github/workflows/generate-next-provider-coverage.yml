name: Generate provider facility coverage
on:
  push:
    branches: [feat/fintraffic-norway-tfl-seoul]
    paths: [.github/workflows/generate-next-provider-coverage.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from official provider facility inventories
        run: |
          python -m pip install --disable-pip-version-check shapely==2.1.2 pyproj==3.7.2
          python tools/generate_provider_facility_coverage.py
      - name: Validate with runtime-only geometry parser
        run: |
          python - <<'PY'
          import importlib.util,sys
          from pathlib import Path
          p=Path("custom_components/osm_parking/coverage_geometry.py")
          s=importlib.util.spec_from_file_location("coverage_test",p)
          m=importlib.util.module_from_spec(s);sys.modules[s.name]=m;s.loader.exec_module(m)
          fin=m.load_coverage("fintraffic_liipi_10km.geojson")
          tfl=m.load_coverage("tfl_carpark_10km.geojson")
          # Known provider facility regions.
          assert fin.contains(60.17,24.94)
          assert fin.contains(60.27,25.04)
          assert not fin.contains(50.94,6.96)
          assert tfl.contains(51.58629,0.08832)
          assert not tfl.contains(50.94,6.96)
          assert fin.properties["source_authority"]=="Fintraffic / LIIPI"
          assert tfl.properties["source_authority"]=="Transport for London"
          assert fin.properties["buffer_m"]==10000
          assert tfl.properties["buffer_m"]==10000
          print("PROVIDER_FACILITY_COVERAGE=PASS")
          PY
      - name: Commit generated files
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/fintraffic-norway-tfl-seoul | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/osm_parking/data/coverage/fintraffic_liipi_10km.geojson custom_components/osm_parking/data/coverage/tfl_carpark_10km.geojson
          git diff --cached --check
          git commit -m 'Bundle Fintraffic and TfL facility-derived coverage'
          git push origin HEAD:refs/heads/feat/fintraffic-norway-tfl-seoul
