name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  local-contract:
    name: Local import contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local const imports
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          package = Path("custom_components/osm_parking")
          const_tree = ast.parse((package / "const.py").read_text(encoding="utf-8"))
          exported = set()

          for node in const_tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  exported.add(node.name)
              elif isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name):
                          exported.add(target.id)
              elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                  exported.add(node.target.id)

          missing = []
          for path in package.glob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module == "const":
                      for alias in node.names:
                          if alias.name != "*" and alias.name not in exported:
                              missing.append(f"{path}: {alias.name}")

          if missing:
              raise SystemExit("Missing const imports:\n" + "\n".join(missing))
          print("LOCAL_CONST_IMPORTS=PASS")
          PY

      - name: Validate frontend version contract
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/osm_parking/manifest.json").read_text(encoding="utf-8")
          )
          init_text = Path("custom_components/osm_parking/__init__.py").read_text(encoding="utf-8")
          card_text = Path(
              "custom_components/osm_parking/frontend/osm-parking-map-card.js"
          ).read_text(encoding="utf-8")

          version = manifest["version"]
          init_match = re.search(r'^CARD_VERSION = "([^"]+)"
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
, init_text, re.MULTILINE)
          card_match = re.search(r'<span class="version">v([^<]+)</span>', card_text)

          problems = []
          if not init_match or init_match.group(1) != version:
              problems.append("CARD_VERSION does not match manifest version")
          if not card_match or card_match.group(1) != version:
              problems.append("card badge version does not match manifest version")

          if problems:
              raise SystemExit("\n".join(problems))
          print("FRONTEND_VERSION_CONTRACT=PASS")
          PY

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
