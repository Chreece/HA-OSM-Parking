name: Probe next official parking providers
on:
  push:
    branches: [feat/luxembourg-basel-zurich-providers]
    paths: [.github/workflows/probe-next-providers.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public official endpoints
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          import json, xml.etree.ElementTree as ET, re
          def get(url, *, accept='*/*'):
              req=Request(url,headers={'User-Agent':'HA-OSM-Parking-provider-probe','Accept':accept})
              with urlopen(req,timeout=20) as r:
                  raw=r.read(8_000_000)
                  print('\nURL',url,'STATUS',r.status,'CTYPE',r.headers.get('content-type'),'BYTES',len(raw))
                  return raw
          # Luxembourg City
          raw=get('https://feed.vdl.lu/circulation/parking/feed.json', accept='application/json')
          data=json.loads(raw)
          print('VDL TYPE',type(data).__name__)
          print('VDL TOP',json.dumps(data,ensure_ascii=False)[:12000])
          if isinstance(data,dict):
              parking=data.get('parking')
              print('VDL PARKING TYPE',type(parking).__name__)
              if isinstance(parking,dict):
                  print('VDL PARKING KEYS',list(parking)[:80])
                  for k,v in parking.items():
                      if isinstance(v,list):
                          print('VDL PARKING LIST',k,'COUNT',len(v))
                          if v: print('VDL PARKING SAMPLE',json.dumps(v[0],ensure_ascii=False)[:8000])
              elif isinstance(parking,list):
                  print('VDL PARKING COUNT',len(parking))
                  if parking: print('VDL PARKING SAMPLE',json.dumps(parking[0],ensure_ascii=False)[:8000])
          # CFL list + first two details
          raw=get('https://pr-mobile-a.cfl.lu/OpenData/ParkAndRide/', accept='application/json')
          cfl=json.loads(raw)
          print('CFL LIST TYPE',type(cfl).__name__)
          print('CFL LIST SAMPLE',json.dumps(cfl[:2] if isinstance(cfl,list) else cfl,ensure_ascii=False)[:7000])
          rows=cfl if isinstance(cfl,list) else cfl.get('items') or cfl.get('data') or []
          for item in rows[:2]:
              pid=item.get('id') if isinstance(item,dict) else None
              if pid:
                  detail=json.loads(get('https://pr-mobile-a.cfl.lu/OpenData/ParkAndRide/'+str(pid), accept='application/json'))
                  print('CFL DETAIL',pid,json.dumps(detail,ensure_ascii=False)[:7000])
          # Basel
          base='https://data.bs.ch/api/explore/v2.1/catalog/datasets/100088/records?'+urlencode({'limit':100,'timezone':'Europe/Zurich'})
          basel=json.loads(get(base, accept='application/json'))
          print('BASEL KEYS',list(basel)[:20])
          print('BASEL COUNT',len(basel.get('results',[])),'TOTAL',basel.get('total_count'))
          for item in basel.get('results',[])[:3]:
              print('BASEL SAMPLE',json.dumps(item,ensure_ascii=False)[:6000])
          # Zurich RSS
          zraw=get('https://www.pls-zh.ch/plsFeed/rss', accept='application/xml,text/xml,*/*')
          print('ZURICH XML HEAD',zraw[:1500].decode('utf-8','replace'))
          root=ET.fromstring(zraw)
          items=root.findall('.//item')
          print('ZURICH RSS ITEMS',len(items))
          for item in items[:4]:
              vals={child.tag:(child.text or '') for child in list(item)}
              print('ZURICH ITEM',json.dumps(vals,ensure_ascii=False)[:5000])
          # Zurich official garage geography via published WFS
          wfs='https://www.ogd.stadt-zuerich.ch/wfs/geoportal/Oeffentlich_zugaengliche_Parkhaeuser'
          cap=get(wfs+'?'+urlencode({'service':'WFS','version':'1.1.0','request':'GetCapabilities'}), accept='application/xml,text/xml,*/*')
          root=ET.fromstring(cap)
          names=[]
          for el in root.iter():
              if el.tag.endswith('FeatureType'):
                  for child in el:
                      if child.tag.endswith('Name') and child.text:
                          names.append(child.text.strip());break
          print('ZURICH WFS LAYERS',names)
          if names:
              zurl=wfs+'?'+urlencode({'service':'WFS','version':'1.1.0','request':'GetFeature','typename':names[0],'outputFormat':'GeoJSON','srsName':'EPSG:4326'})
              zgraw=get(zurl, accept='application/geo+json,application/json,*/*')
              zgeo=json.loads(zgraw)
              print('ZURICH GEO TYPE',zgeo.get('type'),'COUNT',len(zgeo.get('features',[])))
              for ft in zgeo.get('features',[])[:5]:
                  print('ZURICH GEO SAMPLE',json.dumps(ft,ensure_ascii=False)[:6000])
          PY
