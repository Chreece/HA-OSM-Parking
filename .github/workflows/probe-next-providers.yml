name: Probe next official parking providers
on:
  push:
    branches: [feat/luxembourg-basel-zurich]
    paths: [.github/workflows/probe-next-providers.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public official endpoints
        run: python tools/probe_next_providers.py
      - name: Upload raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-provider-probes
          path: provider-evidence-next/
          retention-days: 7
