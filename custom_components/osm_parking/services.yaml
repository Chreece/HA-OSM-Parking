find_parking:
  target: {}
  fields:
    latitude:
      required: true
      example: 50.110924
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      required: true
      example: 8.682127
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    radius_m:
      required: false
      example: 1500
      selector:
        number:
          min: 100
          max: 10000
          step: 100
          unit_of_measurement: m
          mode: box
    parking_types:
      required: false
      example:
        - underground
        - multi_storey
      selector:
        select:
          multiple: true
          translation_key: parking_types
          options:
            - paid
            - open
            - street
            - underground
            - multi_storey
            - park_and_ride
            - other
    max_results:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 25
          step: 1
          mode: box
    include_restricted:
      required: false
      selector:
        boolean:
    provider_settings:
      collapsed: true
      fields:
        config_entry_id:
          required: false
          selector:
            config_entry:
              integration: osm_parking
